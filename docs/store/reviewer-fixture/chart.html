<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sample dashboard - ColorAdapt reviewer page</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font:
          16px/1.45 system-ui,
          sans-serif;
        margin: 0;
        background: #ffffff;
        color: #222222;
      }
      header {
        background: #1f3a5f;
        color: #ffffff;
        padding: 14px 24px;
      }
      header h1 {
        margin: 0;
        font-size: 20px;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px 24px 32px;
        display: grid;
        gap: 20px;
        grid-template-columns: 1fr 1fr;
      }
      section {
        border: 1px solid #d5d9df;
        border-radius: 8px;
        padding: 14px 16px;
      }
      section.wide {
        grid-column: 1 / -1;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .alert {
        padding: 8px 12px;
        border-radius: 6px;
        margin: 0 0 8px;
      }
      .alert.success {
        background: #e3f3e3;
        color: #2e8b2e;
      }
      .alert.error {
        background: #fbe4e4;
        color: #d13b3b;
      }
      .btn {
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        margin-right: 8px;
      }
      .btn-ok {
        background: #2e8b2e;
      }
      .btn-bad {
        background: #d13b3b;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #e3e6ea;
      }
      .badge {
        display: inline-block;
        padding: 1px 9px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        color: #ffffff;
      }
      .badge.success {
        background: #2e8b2e;
      }
      .badge.error {
        background: #d13b3b;
      }
      .status {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 8px;
      }
      .status.online {
        background: #2e8b2e;
      }
      .status.offline {
        background: #d13b3b;
      }
      .delta.positive {
        color: #2e8b2e;
        font-weight: 700;
      }
      .delta.negative {
        color: #d13b3b;
        font-weight: 700;
      }
      .muted {
        color: #aaaaaa;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input[type='text'] {
        font: inherit;
        padding: 6px 8px;
        border: 2px solid #2e8b2e;
        border-radius: 4px;
        width: 80%;
      }
      input[aria-invalid='true'] {
        border-color: #d13b3b;
      }
      .field-error {
        color: #d13b3b;
        margin: 4px 0 0;
      }
      .icons button {
        background: transparent;
        border: 1px solid #c4c9d0;
        border-radius: 6px;
        padding: 6px;
        margin-right: 8px;
      }
      svg.icon {
        width: 24px;
        height: 24px;
        display: block;
      }
      svg.chart {
        max-width: 100%;
        height: auto;
      }
      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header><h1>Sample dashboard: chart</h1></header>
    <main>
      <section class="wide" aria-labelledby="h-chart">
        <h2 id="h-chart">Weekly visits by channel</h2>
        <svg
          id="visits"
          class="chart line-chart"
          width="480"
          height="320"
          viewBox="0 0 480 320"
          aria-label="Weekly visits by channel"
          role="img"
        >
          <g class="axis x-axis" fill="none" transform="translate(0,270)">
            <path class="domain" stroke="#666" d="M50 0 H440"></path>
            <g class="tick" transform="translate(50,0)">
              <line stroke="#666" y2="6"></line>
              <text fill="#222" y="18" text-anchor="middle" font-size="10">0</text>
            </g>
            <g class="tick" transform="translate(128,0)">
              <line stroke="#666" y2="6"></line>
              <text fill="#222" y="18" text-anchor="middle" font-size="10">10</text>
            </g>
            <g class="tick" transform="translate(206,0)">
              <line stroke="#666" y2="6"></line>
              <text fill="#222" y="18" text-anchor="middle" font-size="10">20</text>
            </g>
            <g class="tick" transform="translate(284,0)">
              <line stroke="#666" y2="6"></line>
              <text fill="#222" y="18" text-anchor="middle" font-size="10">30</text>
            </g>
            <g class="tick" transform="translate(362,0)">
              <line stroke="#666" y2="6"></line>
              <text fill="#222" y="18" text-anchor="middle" font-size="10">40</text>
            </g>
            <g class="tick" transform="translate(440,0)">
              <line stroke="#666" y2="6"></line>
              <text fill="#222" y="18" text-anchor="middle" font-size="10">50</text>
            </g>
          </g>
          <g class="axis y-axis" fill="none" transform="translate(50,0)">
            <path class="domain" stroke="#666" d="M0 20 V270"></path>
            <g class="tick" transform="translate(0,270)">
              <line stroke="#666" x2="-6"></line>
              <text fill="#222" x="-9" dy="0.32em" text-anchor="end" font-size="10">0</text>
            </g>
            <g class="tick" transform="translate(0,207.5)">
              <line stroke="#666" x2="-6"></line>
              <text fill="#222" x="-9" dy="0.32em" text-anchor="end" font-size="10">25</text>
            </g>
            <g class="tick" transform="translate(0,145)">
              <line stroke="#666" x2="-6"></line>
              <text fill="#222" x="-9" dy="0.32em" text-anchor="end" font-size="10">50</text>
            </g>
            <g class="tick" transform="translate(0,82.5)">
              <line stroke="#666" x2="-6"></line>
              <text fill="#222" x="-9" dy="0.32em" text-anchor="end" font-size="10">75</text>
            </g>
            <g class="tick" transform="translate(0,20)">
              <line stroke="#666" x2="-6"></line>
              <text fill="#222" x="-9" dy="0.32em" text-anchor="end" font-size="10">100</text>
            </g>
          </g>
          <g class="plot">
            <path
              class="series series-0"
              fill="none"
              stroke="#d62728"
              stroke-width="2"
              d="M50.0 205.2 L97.1 136.1 L144.3 117.8 L191.4 132.2 L238.6 203.8 L285.7 244.7 L332.9 282.4 L380.0 271.5"
            ></path>
            <path
              class="series series-1"
              fill="none"
              stroke="#2ca02c"
              stroke-width="2"
              d="M50.0 129.3 L97.1 99.9 L144.3 133.2 L191.4 200.6 L238.6 253.3 L285.7 266.3 L332.9 235.4 L380.0 174.4"
            ></path>
            <path
              class="series series-2"
              fill="none"
              stroke="#bc8f00"
              stroke-width="2"
              d="M50.0 97.7 L97.1 148.5 L144.3 207.4 L191.4 242.5 L238.6 253.5 L285.7 210.2 L332.9 158.1 L380.0 99.7"
            ></path>
          </g>
          <g class="legend" transform="translate(330,8)">
            <g class="legend-item" transform="translate(0,0)">
              <line
                class="swatch"
                x1="0"
                x2="20"
                y1="5"
                y2="5"
                stroke="#d62728"
                stroke-width="2"
              ></line>
              <text x="26" y="10" fill="#222" font-size="11">Search</text>
            </g>
            <g class="legend-item" transform="translate(0,16)">
              <line
                class="swatch"
                x1="0"
                x2="20"
                y1="5"
                y2="5"
                stroke="#2ca02c"
                stroke-width="2"
              ></line>
              <text x="26" y="10" fill="#222" font-size="11">Direct</text>
            </g>
            <g class="legend-item" transform="translate(0,32)">
              <line
                class="swatch"
                x1="0"
                x2="20"
                y1="5"
                y2="5"
                stroke="#bc8f00"
                stroke-width="2"
              ></line>
              <text x="26" y="10" fill="#222" font-size="11">Referral</text>
            </g>
          </g>
        </svg>
      </section>
      <section class="wide">
        <p><a href="index.html">Back to the dashboard</a></p>
      </section>
    </main>
  </body>
</html>
